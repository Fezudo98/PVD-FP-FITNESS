<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Etiqueta - Sistema FP Moda Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        .print-toolbar {
            background-color: var(--cor-card);
            border-bottom: 1px solid #444;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .print-frame-wrapper {
            flex: 1;
            background: #525659;
        }

        #etiquetaFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media print {
            .print-toolbar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="print-toolbar">
        <div>
            <strong class="text-warning"><i class="fa-solid fa-print me-2"></i>Etiqueta - Pedido #<span id="vendaIdLabel">-</span></strong>
            <span class="text-white-50 small ms-2 d-none d-md-inline">A janela de impressão do navegador deve abrir automaticamente. Selecione a impressora térmica e confirme.</span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-warning btn-sm fw-bold" id="btnImprimir"><i class="fa-solid fa-print me-1"></i>Imprimir</button>
            <a href="javascript:void(0)" id="btnAbrirNovaAba" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-up-right-from-square me-1"></i>Abrir em nova aba</a>
            <a href="/loja_online.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
        </div>
    </div>
    <div class="print-frame-wrapper">
        <iframe id="etiquetaFrame" title="Etiqueta de envio"></iframe>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = '/login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const vendaId = params.get('venda_id');

        if (!vendaId) {
            document.body.innerHTML = '<div class="p-5 text-center text-white">ID do pedido não informado.</div>';
        } else {
            document.getElementById('vendaIdLabel').textContent = vendaId;

            const pdfUrl = `/api/vendas/${vendaId}/etiqueta/pdf?token=${encodeURIComponent(token)}`;
            const frame = document.getElementById('etiquetaFrame');
            frame.src = pdfUrl;
            document.getElementById('btnAbrirNovaAba').href = pdfUrl;

            let jaTentouAutoImprimir = false;
            frame.addEventListener('load', () => {
                // So dispara a impressão automática uma vez (evita reabrir o dialogo se o
                // iframe recarregar por qualquer motivo).
                if (jaTentouAutoImprimir) return;
                jaTentouAutoImprimir = true;
                setTimeout(() => {
                    try {
                        frame.contentWindow.focus();
                        frame.contentWindow.print();
                    } catch (e) {
                        console.error('Não foi possível disparar a impressão automaticamente:', e);
                    }
                }, 400);
            });

            document.getElementById('btnImprimir').addEventListener('click', () => {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                } catch (e) {
                    window.open(pdfUrl, '_blank');
                }
            });
        }
    </script>
</body>

</html>
