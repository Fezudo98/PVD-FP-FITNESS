<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Etiqueta - Sistema FP Moda Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        .print-toolbar {
            background-color: var(--cor-card);
            border-bottom: 1px solid #444;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .print-frame-wrapper {
            flex: 1;
            background: #525659;
        }

        #etiquetaFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media print {
            .print-toolbar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="print-toolbar">
        <div>
            <strong class="text-warning"><i class="fa-solid fa-print me-2"></i>Etiqueta - Pedido #<span id="vendaIdLabel">-</span></strong>
            <span class="text-white-50 small ms-2 d-none d-md-inline" id="statusMsg">Buscando a etiqueta...</span>
        </div>
        <div class="d-flex gap-2">
            <a href="/loja_online.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
        </div>
    </div>
    <div class="print-frame-wrapper d-flex align-items-center justify-content-center">
        <div class="text-white-50 text-center" id="mensagemCentral">
            <div class="spinner-border text-warning mb-3"></div>
            <p>Redirecionando para a etiqueta...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = '/login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const vendaId = params.get('venda_id');

        // A etiqueta do Melhor Envio é uma página renderizada por JS deles (CSP proibe embutir
        // em iframe de outro domínio: "frame-ancestors" só libera os próprios domínios do ME),
        // então não dá pra embutir nem reservir como PDF puro via proxy - a saída é navegar
        // direto pra URL pública que eles hospedam, que já cuida da própria impressão.
        if (!vendaId) {
            document.body.innerHTML = '<div class="p-5 text-center text-white">ID do pedido não informado.</div>';
        } else {
            document.getElementById('vendaIdLabel').textContent = vendaId;

            fetch(`/api/vendas/${vendaId}`, { headers: { 'x-access-token': token } })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.message || data.erro || 'Não foi possível carregar o pedido.');
                    if (!data.etiqueta_url) throw new Error('Este pedido ainda não tem etiqueta gerada.');
                    document.getElementById('statusMsg').textContent = 'Abrindo a etiqueta no Melhor Envio...';
                    window.location.replace(data.etiqueta_url);
                })
                .catch(error => {
                    console.error('Erro ao carregar etiqueta:', error);
                    document.getElementById('mensagemCentral').innerHTML = `<p class="text-danger">${error.message}</p>`;
                });
        }
    </script>
</body>

</html>
