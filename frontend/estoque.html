<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Estoque - Sistema FP Moda Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CORRIGIDO: Adicionado o nome do arquivo style.css -->
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <div class="background-container"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- CORREÇÃO APLICADA AQUI -->
            <a class="navbar-brand" href="/index.html"><img src="/logo.jpg" alt="Logo" width="100"></a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="adminNavbar">
                <div class="d-flex flex-column flex-lg-row mt-3 mt-lg-0 w-100 justify-content-end">
                <div class="dropdown me-2">
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="themeDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-palette"></i> Temas
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="themeDropdown" id="themeSelector">
                        <!-- Populated by JS -->
                    </ul>
                </div>
                <a href="/index.html" class="btn btn-outline-secondary me-2">Voltar ao Painel</a>
                <a href="/manual.html" class="btn btn-outline-info me-2" title="Manual do Sistema">
                    <i class="fas fa-book"></i> Manual
                </a>
                <button class="btn btn-outline-warning" id="logoutButton">Sair</button>
            </div>
</div>
        </div>
    </nav>

    <main class="container main-content mt-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2>Consultar Estoque</h2>
            </div>
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nome ou SKU...">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>SKU</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Cor/Tamanho</th>
                        <th>Preço Venda</th>
                        <th>Quantidade</th>
                        <th>Cód. Barras</th>
                    </tr>
                </thead>
                <tbody id="estoqueTableBody">
                    <!-- Linhas da tabela serão inseridas aqui -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme_manager.js"></script>
    <!-- CORRIGIDO: Adicionado o nome do arquivo estoque.js -->
    <script src="/js/estoque.js"></script>
</body>

</html>
