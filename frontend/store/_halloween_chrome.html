{% if store_halloween.active %}
<div class="halloween-season-bar">
    <span class="halloween-bat halloween-bat-left" aria-hidden="true"></span>
    <span class="halloween-season-copy">
        <strong>Halloween FitPro</strong>
        {% if store_halloween.end_label %}<span>até {{ store_halloween.end_label }}</span>{% endif %}
    </span>
    <span class="halloween-moon" aria-hidden="true"></span>
    <span class="halloween-bat halloween-bat-right" aria-hidden="true"></span>
</div>
<div class="halloween-atmosphere" aria-hidden="true">
    <svg class="halloween-web halloween-web-left" viewBox="0 0 180 180" focusable="false">
        <path d="M0 0H180M0 0V180M0 0L145 145M0 0L68 168M0 0L168 68"/>
        <path d="M32 0A32 32 0 0 1 0 32M67 0A67 67 0 0 1 0 67M105 0A105 105 0 0 1 0 105M145 0A145 145 0 0 1 0 145"/>
    </svg>
    <svg class="halloween-web halloween-web-right" viewBox="0 0 180 180" focusable="false">
        <path d="M0 0H180M0 0V180M0 0L145 145M0 0L68 168M0 0L168 68"/>
        <path d="M32 0A32 32 0 0 1 0 32M67 0A67 67 0 0 1 0 67M105 0A105 105 0 0 1 0 105M145 0A145 145 0 0 1 0 145"/>
    </svg>

    <div class="halloween-bat-flock">
        <span class="halloween-flying-bat bat-one"></span>
        <span class="halloween-flying-bat bat-two"></span>
        <span class="halloween-flying-bat bat-three"></span>
        <span class="halloween-flying-bat bat-four"></span>
        <span class="halloween-flying-bat bat-five"></span>
    </div>

    <div class="halloween-witch-scene">
        <span class="halloween-witch-moon"></span>
        <svg class="halloween-witch" viewBox="0 0 190 105" focusable="false">
            <path d="M35 74c17-4 32-9 47-15l-19 2 2-8 28 2 10-13 5-19 8 18 17 8-10 7-2 14 20 8-5 7-27-9-12 10-8-17c-15 7-31 13-49 18l-5-3z"/>
            <path d="M8 84c35-4 65-12 91-25l4 7C75 79 44 88 10 92z"/>
            <path d="M103 23l12-17 8 23z"/>
        </svg>
    </div>

    <div class="halloween-hanging-spider">
        <span class="spider-thread"></span>
        <span class="spider-body"></span>
    </div>
</div>
{% endif %}
