{% extends "store/base.html" %}

{% block content %}
<section class="py-4 py-md-5 bg-light" style="min-height: 80vh;">
    <div class="container py-3 py-md-4">
        <nav aria-label="breadcrumb" class="small mb-2">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/store" class="text-decoration-none text-muted">Início</a></li>
                <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page">Produtos</li>
            </ol>
        </nav>
        <h1 class="fw-bold text-dark mb-4" style="font-family: 'Outfit', sans-serif;">Produtos</h1>

        <div class="row g-4">
            <!-- Sidebar de filtros: coluna fixa em telas grandes (lg+), acordeao recolhivel no
                 mobile (d-lg-block forca visivel em telas grandes, ignorando o estado do collapse).
                 Trocado de offcanvas pra collapse simples porque o offcanvas tinha um wrapper com
                 fundo/borda proprios do Bootstrap conflitando visualmente com o card por dentro. -->
            <div class="col-lg-3">
                <button class="btn btn-outline-dark rounded-pill w-100 mb-3 d-lg-none" type="button"
                    data-bs-toggle="collapse" data-bs-target="#filtrosCollapse" aria-expanded="false"
                    aria-controls="filtrosCollapse">
                    <i class="fa-solid fa-sliders me-2"></i>Filtros
                </button>
                <div class="collapse d-lg-block" id="filtrosCollapse">
                    <div class="bg-white rounded-4 shadow-sm border p-4">
                        <!-- Categorias -->
                        <div class="mb-4">
                            <h6 class="fw-bold text-uppercase small mb-3" style="letter-spacing: 1px;">Categorias</h6>
                            <ul class="list-unstyled mb-0" id="categoryListSidebar">
                                <li class="mb-2">
                                    <a href="javascript:void(0)" class="text-decoration-none category-link fw-semibold text-dark active"
                                        data-categoria="">Todas as Categorias</a>
                                </li>
                            </ul>
                        </div>

                        <hr>

                        <!-- Filtrar por -->
                        <div class="mb-4">
                            <h6 class="fw-bold text-uppercase small mb-3" style="letter-spacing: 1px;">Filtrar por</h6>

                            <div class="mb-4">
                                <div class="text-uppercase small text-muted fw-bold mb-2" style="letter-spacing: 1px;">Tamanho</div>
                                <div id="sizeFilterList" class="d-flex flex-column gap-2">
                                    <span class="text-muted small">Carregando...</span>
                                </div>
                            </div>

                            <div class="mb-2">
                                <div class="text-uppercase small text-muted fw-bold mb-2" style="letter-spacing: 1px;">Preço</div>
                                <div class="d-flex gap-2 align-items-center mb-1">
                                    <span class="text-muted small">R$</span>
                                    <input type="number" class="form-control form-control-sm price-range-input" id="precoMinInput" placeholder="De">
                                    <span class="text-muted small">R$</span>
                                    <input type="number" class="form-control form-control-sm price-range-input" id="precoMaxInput" placeholder="Até">
                                </div>
                                <button class="btn btn-sm btn-outline-dark w-100 mt-2" id="aplicarPrecoBtn">Aplicar</button>
                            </div>
                        </div>

                        <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none d-none" id="limparFiltrosBtn">
                            <i class="fa-solid fa-xmark me-1"></i>Limpar todos os filtros
                        </button>

                        <!-- Fechar o painel (mobile) -->
                        <button class="btn btn-warning fw-bold w-100 rounded-pill mt-4 d-lg-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#filtrosCollapse">Ver Resultados</button>
                    </div>
                </div>
            </div>

            <!-- Produtos -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-muted small" id="resultCount"></span>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border-0" style="width: 260px; flex: 0 0 auto;">
                            <input type="text" class="form-control premium-filter price-range-input border-0 py-2 px-3" placeholder="Buscar peças..." id="searchInput" style="box-shadow: none;">
                            <button class="btn btn-warning border-0 px-3 transition-scale" type="button" onclick="searchProducts()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <select class="form-select premium-filter rounded-pill shadow-sm border-0 py-2 px-4 text-dark fw-bold" id="sortFilter" onchange="filterBySort()" style="width: auto; flex: 0 0 auto; background-color: #ffffff;">
                            <option value="mais_vendidos">🔥 Mais Vendidos</option>
                            <option value="alfabetica">📝 Ordem Alfabética</option>
                            <option value="preco_crescente">🔽 Menor Preço</option>
                            <option value="preco_decrescente">🔼 Maior Preço</option>
                        </select>
                    </div>
                </div>

                <!-- Chips de filtros ativos -->
                <div class="d-flex flex-wrap gap-2 mb-3" id="activeFiltersChips"></div>

                <style>
                    /* /css/style.css define .form-control com tema escuro globalmente (usado no
                       painel admin) - isolado aqui pra nao vazar pros campos de preco da loja. */
                    .price-range-input {
                        background-color: #ffffff !important;
                        color: var(--text-primary) !important;
                        border: 1px solid var(--border-color) !important;
                    }

                    .price-range-input::placeholder {
                        color: #adb5bd;
                    }

                    .price-range-input:focus {
                        background-color: #ffffff !important;
                        color: var(--text-primary) !important;
                        border-color: var(--primary-gold) !important;
                        box-shadow: 0 0 0 0.2rem rgba(224, 180, 49, 0.25) !important;
                    }

                    .premium-filter:focus {
                        border-color: #ffc107 !important;
                        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25) !important;
                        outline: none;
                    }

                    .category-link.active {
                        color: var(--primary-gold) !important;
                        font-weight: 700 !important;
                    }

                    .size-check-label {
                        cursor: pointer;
                    }

                    .filter-chip {
                        background: #fff;
                        border: 1px solid var(--border-color);
                        border-radius: 50px;
                        padding: 0.3rem 0.9rem;
                        font-size: 0.8rem;
                        display: inline-flex;
                        align-items: center;
                        gap: 0.5rem;
                    }

                    .filter-chip button {
                        border: none;
                        background: none;
                        padding: 0;
                        line-height: 1;
                        color: #999;
                    }

                </style>

                <div class="row g-4" id="productsContainer">
                    <!-- Products will be loaded here via JS -->
                    <div class="col-12 text-center">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>

                <!-- Pagination (Simplified) -->
                <div class="row mt-5">
                    <div class="col-12 text-center">
                        <button class="btn btn-outline-dark rounded-pill px-4" id="loadMoreBtn" onclick="loadMore()"
                            style="display: none;">Carregar Mais</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/frontend/js/products.js?v=2"></script>
{% endblock %}
