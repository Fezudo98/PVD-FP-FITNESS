<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Atividade - Sistema FP Moda Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <!-- Fundo desfocado padrão -->
    <div class="background-container"></div>

    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html"><img src="/logo.jpg" alt="Logo" width="100"></a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="adminNavbar">
                <div class="d-flex flex-column flex-lg-row mt-3 mt-lg-0 w-100 justify-content-end">
                <div class="dropdown me-2">
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="themeDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-palette"></i> Temas
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="themeDropdown" id="themeSelector">
                        <!-- Populated by JS -->
                    </ul>
                </div>
                <a href="/index.html" class="btn btn-outline-secondary me-2">Voltar ao Painel</a>
                <a href="/manual.html" class="btn btn-outline-info me-2" title="Manual do Sistema">
                    <i class="fas fa-book"></i> Manual
                </a>
                <button class="btn btn-outline-warning" id="logoutButton">Sair</button>
            </div>
</div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container main-content mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Diário de Bordo (Logs de Atividade)</h2>
        </div>

        <p class="text-muted">
            Exibindo as 200 atividades mais recentes registradas no sistema.
        </p>

        <!-- Tabela de Logs -->
        <div class="table-responsive">
            <table class="table table-dark table-hover table-sm">
                <thead>
                    <tr>
                        <th style="width: 15%;">Data/Hora</th>
                        <th style="width: 15%;">Usuário</th>
                        <th style="width: 20%;">Ação</th>
                        <th style="width: 50%;">Detalhes</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <!-- As linhas de log serão inseridas aqui pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme_manager.js?v=2"></script>
    <!-- Nosso novo arquivo JavaScript para esta página -->
    <script src="/js/logs.js"></script>
</body>

</html>
