<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações de Produtos - Sistema FP Moda Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .media-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: transform 0.2s;
        }
        .media-thumbnail:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="background-container"></div>

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html"><img src="/static/img/logo.png?v=3" alt="Logo" width="100"></a>
            <div class="d-flex align-items-center ms-auto">
                <a href="/index.html" class="btn btn-outline-light me-2"><i class="fas fa-home"></i> Painel</a>
            </div>
        </div>
    </nav>

    <main class="container main-content mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-chat-left-heart text-warning me-2"></i> Avaliações de Produtos</h2>
        </div>

        <!-- Dashboard Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card bg-warning text-dark border-0 shadow-sm h-100 p-4">
                    <h5 class="fw-bold mb-1">Média Global</h5>
                    <h1 class="display-3 fw-bold mb-0" id="avgNota">0.0</h1>
                    <div id="avgStars" class="text-dark mt-2" style="font-size: 1.5rem;"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm h-100 p-4 text-center justify-content-center">
                    <h5 class="text-muted fw-bold mb-1">Total de Avaliações</h5>
                    <h1 class="display-3 fw-bold text-dark mb-0" id="totalAvaliacoes">0</h1>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm h-100 p-4 justify-content-center">
                    <h5 class="text-muted fw-bold mb-3">Distribuição</h5>
                    <div class="d-flex align-items-center mb-1">
                        <span class="me-2" style="width: 20px;">5<i class="fas fa-star text-warning fa-xs"></i></span>
                        <div class="progress flex-grow-1" style="height: 10px;">
                            <div class="progress-bar bg-success" id="bar5" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-1">
                        <span class="me-2" style="width: 20px;">4<i class="fas fa-star text-warning fa-xs"></i></span>
                        <div class="progress flex-grow-1" style="height: 10px;">
                            <div class="progress-bar bg-primary" id="bar4" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-1">
                        <span class="me-2" style="width: 20px;">3<i class="fas fa-star text-warning fa-xs"></i></span>
                        <div class="progress flex-grow-1" style="height: 10px;">
                            <div class="progress-bar bg-info" id="bar3" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-1">
                        <span class="me-2" style="width: 20px;">2<i class="fas fa-star text-warning fa-xs"></i></span>
                        <div class="progress flex-grow-1" style="height: 10px;">
                            <div class="progress-bar bg-warning" id="bar2" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="me-2" style="width: 20px;">1<i class="fas fa-star text-warning fa-xs"></i></span>
                        <div class="progress flex-grow-1" style="height: 10px;">
                            <div class="progress-bar bg-danger" id="bar1" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Avaliações -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4 py-3">Data</th>
                                <th>Produto</th>
                                <th>Cliente</th>
                                <th>Nota</th>
                                <th>Comentário / Mídia</th>
                            </tr>
                        </thead>
                        <tbody id="avaliacoesTableBody">
                            <tr><td colspan="5" class="text-center py-4">Carregando avaliações...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Media Preview -->
    <div class="modal fade" id="mediaPreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center" id="mediaPreviewBody">
                    <!-- Image or Video will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme_manager.js"></script>
    <script src="/js/avaliacoes_produtos.js"></script>
</body>
</html>
