<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de Medidas - Sistema FitPro Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .medida-card {
            background: linear-gradient(145deg, #24272c 0%, #1a1c20 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 14px;
        }

        .medida-card table {
            margin-top: 10px;
        }

        .linha-medida-row input {
            min-width: 90px;
        }
    </style>
</head>

<body>
    <div class="background-container"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html"><img src="/logo.jpg?v=2" alt="Logo" width="100"></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
                aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="adminNavbar">
                <div class="d-flex flex-column flex-lg-row mt-3 mt-lg-0 w-100 justify-content-end">
                    <a href="/index.html" class="btn btn-outline-secondary me-2">Voltar ao Painel</a>
                    <a href="/manual.html" class="btn btn-outline-info me-2" title="Manual do Sistema">
                        <i class="fas fa-book"></i> Manual
                    </a>
                    <button class="btn btn-outline-warning" id="logoutButton">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container main-content mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-white mb-1">Tabelas de Medidas</h2>
                <p class="text-white-50 small mb-0">Uma tabela por categoria de produto - vale pra todo produto
                    cadastrado com aquela categoria. Aparece automaticamente na página do produto na loja.</p>
            </div>
            <button class="btn btn-custom" id="addTabelaBtn"><i class="fas fa-plus me-2"></i>Nova Tabela</button>
        </div>

        <div id="tabelasContainer">
            <!-- Cards das tabelas, preenchidos via JS -->
        </div>
    </main>

    <!-- Modal Adicionar/Editar Tabela de Medidas -->
    <div class="modal fade" id="tabelaModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="tabelaModalTitle">Nova Tabela de Medidas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tabelaForm">
                        <input type="hidden" id="tabelaId">
                        <div class="mb-3">
                            <label for="tabelaCategoria" class="form-label">Categoria</label>
                            <input type="text" class="form-control" id="tabelaCategoria" list="categoriasList"
                                placeholder="Ex: Legging" required>
                            <datalist id="categoriasList"></datalist>
                            <small class="form-text text-muted">Precisa bater exatamente com o nome da categoria
                                usada no cadastro de produtos.</small>
                        </div>
                        <div class="mb-3">
                            <label for="tabelaObservacao" class="form-label">Observação (opcional)</label>
                            <input type="text" class="form-control" id="tabelaObservacao"
                                placeholder="Ex: Medidas em centímetros, peça planificada">
                        </div>

                        <hr class="border-secondary">

                        <div class="mb-2 d-flex justify-content-between align-items-center">
                            <label class="form-label mb-0">Colunas de medida</label>
                            <button type="button" class="btn btn-sm btn-outline-light" id="addColunaBtn">
                                <i class="fas fa-plus"></i> Adicionar Coluna
                            </button>
                        </div>
                        <div id="colunasContainer" class="d-flex flex-wrap gap-2 mb-3">
                            <!-- Inputs de coluna -->
                        </div>

                        <div class="mb-2 d-flex justify-content-between align-items-center">
                            <label class="form-label mb-0">Linhas (tamanhos)</label>
                            <button type="button" class="btn btn-sm btn-outline-light" id="addLinhaBtn">
                                <i class="fas fa-plus"></i> Adicionar Tamanho
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-dark table-sm align-middle" id="linhasTable">
                                <thead>
                                    <tr id="linhasTableHead"></tr>
                                </thead>
                                <tbody id="linhasTableBody"></tbody>
                            </table>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="tabelaForm" class="btn btn-custom">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme_manager.js?v=2"></script>
    <script src="/js/tabelas_medidas.js"></script>
</body>

</html>
